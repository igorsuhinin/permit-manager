ServerName localhost
ServerSignature Off
ServerTokens Prod

<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    DirectoryIndex index.php

    <Directory />
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Require all granted
    </Directory>

    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Log the method and path without QR signatures, query values, or referrers.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" safe
    CustomLog ${APACHE_LOG_DIR}/access.log safe
</VirtualHost>
