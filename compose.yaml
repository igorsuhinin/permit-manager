services:
  php:
    build: .
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_IDE_CONFIG: serverName=permit-manager
      TWIG_CACHE_ENABLED: ${TWIG_CACHE_ENABLED:-}
      TWIG_CACHE_DIRECTORY: ${TWIG_CACHE_DIRECTORY:-}
      TWIG_CACHE_VERSION: ${TWIG_CACHE_VERSION:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      PUBLIC_TEMPLATE_DIRECTORY: ${PUBLIC_TEMPLATE_DIRECTORY:-}
      PUBLIC_UI_CONFIG: ${PUBLIC_UI_CONFIG:-}
      INITIAL_BLACKLIST_CONFIG: ${INITIAL_BLACKLIST_CONFIG:-}
      INITIAL_SETTINGS_CONFIG: ${INITIAL_SETTINGS_CONFIG:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-permits}
      DB_USERNAME: ${MYSQL_USER:-permits}
      DB_PASSWORD: ${MYSQL_PASSWORD:-permits_local}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-permits}
      MYSQL_USER: ${MYSQL_USER:-permits}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-permits_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
